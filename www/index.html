<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy: only this site, Google sign-in (GIS), the Drive
         API and Google Fonts may load code / be contacted. Blocks injected
         scripts and inline event handlers (e.g. <img onerror=...> inside a note).
         'wasm-unsafe-eval' is REQUIRED for the WASM crypto to load.
         'unsafe-inline' styles keep formatting inside existing notes.
         img-src allows https: so remote images in pasted notes still show.
         If you add a new external host, add it here or it will be blocked. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f4f1fb" />
    <title>eNotes</title>
    <link rel="preconnect" href="https://accounts.google.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div id="app"></div>
    <div id="overlay-root"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
